<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Heart Disease Prediction System
    </title>

    <link rel="stylesheet" href="login.css">

    <!--Google Fonts-->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href=
"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>


<div class="container">


<!-------------------------------->
<!-- Logo Section -->
<!-------------------------------->


<div class="logo-section">

<img src="../Images/logo.png"
     alt="Application Logo"
     class="logo">

<h1>
Heart Disease Prediction System
</h1>

<p>
Predict • Monitor • Prevent
</p>

</div>



<!-------------------------------->
<!-- Login Card -->
<!-------------------------------->


<div class="login-card">


<h2>
Welcome Back
</h2>


<p class="sub-title">

Login to continue monitoring
your heart health.

</p>



<!-------------------------------->
<!-- Login Form -->
<!-------------------------------->


<form id="loginForm">


<label>Email Address</label>

<input type="email"
       id="email"
       placeholder="Enter your email"
       required>



<label>Password</label>

<input type="password"
       id="password"
       placeholder="Enter your password"
       required>




<div class="remember-forgot">


<div class="remember">


<input type="checkbox"
       id="remember">


<label for="remember">

Remember Me

</label>

</div>


<a href="#">

Forgot Password?

</a>


</div>



<button type="submit">

LOGIN

</button>



</form>



<!-------------------------------->
<!-- Divider -->
<!-------------------------------->


<div class="divider">

<span>OR</span>

</div>




<button class="guest-btn">

Continue as Guest

</button>



<!-------------------------------->
<!-- Register -->
<!-------------------------------->


<div class="register">


<p>

Don't have an account?

</p>


<a href="register.html">

SIGN UP

</a>


</div>



</div>



<!-------------------------------->
<!-- Footer -->
<!-------------------------------->


<footer>

<p>

Heart Disease Prediction System

</p>

<p>

Version 1.0

</p>

</footer>



</div>



<script src="login.js"></script>


</body>

</html>
