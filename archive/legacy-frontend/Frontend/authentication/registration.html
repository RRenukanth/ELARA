<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Patient Registration

</title>


<link rel="stylesheet"
href="registration.css">


<link rel="preconnect"
href="https://fonts.googleapis.com">


<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


</head>



<body>


<div class="container">


<!--=========================
        LOGO SECTION
===========================-->


<div class="logo-section">

<img src="../Images/logo.png"
class="logo"
alt="Logo">


<h1>

Heart Disease Prediction
System

</h1>


<p>

Predict • Monitor • Prevent

</p>


</div>



<!--=========================
      REGISTER CARD
===========================-->


<div class="register-card">


<h2>

Create Your Account

</h2>


<p class="sub-title">

Register as a Patient

</p>



<form id="registerForm">



<!--=========================
        NAME
===========================-->


<div class="row">

<div>

<label>

First Name

</label>

<input type="text"
id="firstName"
placeholder="Enter First Name"
required>

</div>


<div>

<label>

Last Name

</label>

<input type="text"
id="lastName"
placeholder="Enter Last Name"
required>

</div>


</div>



<!--=========================
        EMAIL
===========================-->


<label>

Email Address

</label>


<input type="email"
id="email"
placeholder="Enter Email Address"
required>




<!--=========================
        PASSWORD
===========================-->


<label>

Password

</label>


<input type="password"
id="password"
placeholder="Create Password"
required>




<label>

Confirm Password

</label>


<input type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>




<!--=========================
            AGE
===========================-->


<label>

Age

</label>


<input type="number"
id="age"
placeholder="Enter Age"
required>





<!--=========================
            GENDER
===========================-->


<label>

Gender

</label>


<select id="gender"
required>

<option value="">

Select Gender

</option>

<option value="Male">

Male

</option>

<option value="Female">

Female

</option>

<option value="Other">

Other

</option>

</select>




<!--=========================
        PHONE NUMBER
===========================-->


<label>

Phone Number

</label>


<input type="tel"
id="phone"
placeholder="Enter Phone Number"
required>





<!--=========================
      EMERGENCY CONTACT
===========================-->


<label>

Emergency Contact Number

</label>


<input type="tel"
id="emergencyContact"
placeholder="Enter Emergency Contact Number"
required>




<!--=========================
          BUTTON
===========================-->


<button type="submit">

CREATE ACCOUNT

</button>



</form>



<!--=========================
          LOGIN
===========================-->


<div class="login-link">


<p>

Already have an account?

</p>


<a href="login.html">

LOGIN

</a>


</div>


</div>




<!--=========================
            FOOTER
===========================-->


<footer>

<p>

Heart Disease Prediction System

</p>


<p>

Version 1.0

</p>

</footer>



</div>



<script src="registration.js"></script>


</body>

</html>
