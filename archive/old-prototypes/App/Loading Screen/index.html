<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            /* SIMPLE BACKGROUND */
            background-color: #0f172a;
            font-family: Arial, sans-serif;
        }

        /* LOGO - NO GLOW, NO BACKGROUND */
        .logo {
            width: 180px;
            height: auto;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* LOADING LINE */
        .loading-line {
            width: 220px;
            height: 4px;
            margin-top: 25px;
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background-color: #38bdf8;
            animation: loading 2s ease-in-out infinite;
        }

        @keyframes loading {
            0%   { width: 0%; }
            50%  { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>

<body>

    <!-- Your transparent logo -->
    <img src="logo.png" alt="App Logo" class="logo">

    <!-- Loading line -->
    <div class="loading-line">
        <div class="loading-bar"></div>
    </div>

</body>
</html>
