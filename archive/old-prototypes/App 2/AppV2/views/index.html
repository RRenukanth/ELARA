<!DOCTYPE html>
<html>

<head>

<title>ESP32 Dashboard</title>

<link rel="stylesheet"
href="/style.css">

</head>

<body>

<div class="sidebar">

<h2>Menu</h2>

<button id="liveBtn">
Live Data
</button>

<button id="historyBtn">
History
</button>

</div>

<div class="content">

<h1>
ESP32 Monitor
</h1>

<div id="statusCard">

Status:
<span id="status">
Disconnected
</span>

</div>

<div class="card">

<h3>
Latest Message
</h3>

<p id="message">
Waiting...
</p>

<p id="time">
--
</p>

</div>

<div id="historySection"
style="display:none">

<h2>History</h2>

<table>

<thead>

<tr>
<th>Time</th>
<th>Message</th>
</tr>

</thead>

<tbody id="historyBody">
</tbody>

</table>

</div>

</div>

<script src="/socket.io/socket.io.js">
</script>

<script src="/script.js">
</script>

</body>
</html>
